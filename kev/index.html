<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a question for you 💙</title>
<style>
  :root {
    --sky: #eaf6ff;
    --blue: #4fc3f7;
    --deep-blue: #1e88c7;
    --ink: #0b3d5c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow-x: hidden;
    font-family: "Comic Sans MS", "Segoe UI", Verdana, sans-serif;
    background: linear-gradient(160deg, var(--sky) 0%, #cdeeff 45%, #a6ddff 100%);
    color: var(--ink);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
  }

  .scene {
    position: relative;
    width: min(90vw, 640px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.85);
    border: 3px solid var(--blue);
    border-radius: 28px;
    padding: 48px 36px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(30, 136, 199, 0.25);
    backdrop-filter: blur(4px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .card h1 {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    margin: 0 0 32px;
    color: var(--deep-blue);
    text-shadow: 1px 1px 0 #fff;
  }

  .buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button.yes-btn {
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: bold;
    padding: 14px 30px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--blue), var(--deep-blue));
    color: #fff;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(30, 136, 199, 0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  button.yes-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 22px rgba(30, 136, 199, 0.5);
  }

  button.yes-btn:active {
    transform: translateY(0) scale(0.98);
  }

  /* floating decorative capoos */
  .float-img {
    position: absolute;
    width: clamp(90px, 16vw, 150px);
    z-index: 1;
    filter: drop-shadow(0 8px 14px rgba(30, 136, 199, 0.3));
    animation: bob 4.5s ease-in-out infinite;
  }

  .float-img.hearts {
    top: -60px;
    left: -70px;
    animation-delay: 0s;
  }

  .float-img.cards {
    bottom: -50px;
    right: -80px;
    width: clamp(100px, 18vw, 170px);
    animation-delay: 0.8s;
  }

  .float-img.jump {
    bottom: 10px;
    left: -90px;
    width: clamp(80px, 14vw, 130px);
    animation-delay: 1.6s;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-16px) rotate(3deg); }
  }

  /* celebration screen */
  .celebration {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
    z-index: 10;
    text-align: center;
    padding: 20px;
  }

  .celebration.show {
    opacity: 1;
    pointer-events: auto;
  }

  .celebration h2 {
    font-size: clamp(1.8rem, 6vw, 3rem);
    color: var(--deep-blue);
    margin: 0;
    text-shadow: 2px 2px 0 #fff;
  }

  .celebration img {
    width: min(280px, 60vw);
    filter: drop-shadow(0 12px 20px rgba(30, 136, 199, 0.35));
    animation: pop 0.6s ease;
  }

  @keyframes pop {
    0% { transform: scale(0.4); opacity: 0; }
    70% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }

  .hidden-fade {
    opacity: 0 !important;
    transform: scale(0.9);
    pointer-events: none;
  }

  .heart-confetti {
    position: fixed;
    top: -40px;
    font-size: 1.6rem;
    pointer-events: none;
    z-index: 9;
    animation: fall linear forwards;
  }

  @keyframes fall {
    to {
      transform: translateY(110vh) rotate(360deg);
      opacity: 0.2;
    }
  }
</style>
</head>
<body>

  <div class="scene">
    <img src="capoo-hearts.png" alt="" class="float-img hearts">
    <img src="capoo-cards.png" alt="" class="float-img cards">
    <img src="capoo-jump.png" alt="" class="float-img jump">

    <div class="card" id="card">
      <h1>Will you go on a date with me? 💙</h1>
      <div class="buttons">
        <button class="yes-btn" onclick="reveal()">Yes 💙</button>
        <button class="yes-btn" onclick="reveal()">Yes please 💙</button>
      </div>
    </div>
  </div>

  <div class="celebration" id="celebration">
    <h2>Yay!! 🎉💙</h2>
    <img src="capoo-foryou.png" alt="This is for you">
  </div>

  <script>
    function reveal() {
      document.getElementById('card').classList.add('hidden-fade');
      document.querySelectorAll('.float-img').forEach(el => el.classList.add('hidden-fade'));
      document.getElementById('celebration').classList.add('show');
      startConfetti();
    }

    function startConfetti() {
      const hearts = ['💙', '💠', '🩵', '✨'];
      setInterval(() => {
        const heart = document.createElement('div');
        heart.className = 'heart-confetti';
        heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (3 + Math.random() * 3) + 's';
        heart.style.fontSize = (1 + Math.random() * 1.4) + 'rem';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 7000);
      }, 250);
    }
  </script>

</body>
</html>
